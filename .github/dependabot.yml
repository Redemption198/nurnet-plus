# Dependabot version updates: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  # "npm" covers pnpm projects too ("yarn" is not a valid ecosystem: no updates were opened)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 (the Go compiler) has no JavaScript API yet, which vue-tsc (nuxt typecheck)
      # needs. Lift this once vue-tsc supports it (expected with TypeScript 7.1)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Types for the Node.js the build runs on (node-version in the workflow): move with it
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
