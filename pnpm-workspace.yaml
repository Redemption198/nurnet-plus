allowBuilds:
  esbuild: true
  vue-demi: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
minimumReleaseAgeExclude:
  - "@vite-pwa/nuxt-core@2.0.1"
  - "@vite-pwa/nuxt-vite@2.0.1"
  - "@vite-pwa/nuxt@2.0.1"
overrides:
  vite@*: "catalog:"
  # Dependabot GHSA-g7r4-m6w7-qqqr (esbuild dev server, Windows)
  esbuild@<0.28.1: ^0.28.2
  # Dependabot GHSA-g3hv-75wg-m249: minimatch <11.0.1 has no backported fix;
  # glob <14 relies on APIs minimatch 11 removed, so it moves to 14 too
  glob@>=10 <14: ^14.0.3
  minimatch@<11.0.1: 11.0.3
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
