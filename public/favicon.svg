<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- NurNet+ favicon: the logo on its terracotta tile (BrandMark's symbol), the mark larger so its
       five circles hold at 16px. The PNG fallback, public/pwa/favicon-196.png, is rendered from it -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e86d10"/>
      <stop offset=".5" stop-color="#c44f01"/>
      <stop offset="1" stop-color="#a84401"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <g fill="#fff" transform="translate(32 32) scale(.72) translate(-32 -32)">
    <circle cx="32" cy="32" r="10"/>
    <circle cx="32" cy="11.954" r="7.5"/>
    <circle cx="11.956" cy="32" r="7.5"/>
    <circle cx="52.044" cy="32" r="7.5"/>
    <circle cx="32" cy="52.046" r="7.5"/>
  </g>
</svg>
